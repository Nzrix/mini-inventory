# H2 In-Memory Database for testing
spring.datasource.url=jdbc:h2:mem:inventory_db
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true
spring.jpa.defer-datasource-initialization=true

# Flyway - disable for H2 development
spring.flyway.enabled=false

# JWT
jwt.secret=mySecretKeyForInventorySystemThatIsLongEnough1234567890
jwt.expiration=86400000

# CORS
cors.allowed-origins=http://localhost:4200,http://localhost

# File Upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
